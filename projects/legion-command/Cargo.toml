[package]
name = "vpm"
version = "0.0.1"
authors = ["192607617@qq.com"]
edition = "2021"
description = "High level intermediate representation for Nyar"
repository = "https://github.com/nyar-lang/NyarNative"
documentation = "https://docs.rs/legion-core"
license = "MPL-2.0"

[dependencies]
clap = { version = "4.5.2", features = ["derive"] }
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.91"
serde-types = "0.1.1"
toml = "0.8.10"
json5 = "0.4.1"

[[bin]]
name = "vpm"
path = "src/main.rs"


[[bin]]
name = "vpm-go"
path = "src/main.rs"

[dev-dependencies]

[features]
default = []
