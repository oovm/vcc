[package]
name = "legion-schema"
version = "0.0.0"
authors = ["192607617@qq.com"]
edition = "2021"
description = "High level intermediate representation for Nyar"
repository = "https://github.com/nyar-lang/NyarNative"
documentation = "https://docs.rs/legion-config"
license = "MPL-2.0"

[dependencies]
#clap = { version = "4.5.2", features = ["derive"] }
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.91"
schemars = "0.8.16"

[dependencies.yearly-version]
version = "0.0.5"
features = ["serde", "schemars"]

[dev-dependencies]

[features]
default = []
